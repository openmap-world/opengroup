name: Idea
description: Something you'd like OpenGroup to do
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe how you'd use it in game.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenGroup version
      description: Filled in when you come from the game. Optional.
